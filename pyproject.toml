[project]
name = "small-clinic"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django==6.1.2",
    "django-environ==0.14.0",
    "djangorestframework==3.18.3",
    "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "flake8==7.4.1",
    "isort==9.0.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-django==4.14.0",
    "radon==6.0.1",
    "ruff==0.17.1",
    "time-machine==3.5.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]

[tool.isort]
profile = "black"

[tool.ruff]
extend-exclude = ["migrations"]
