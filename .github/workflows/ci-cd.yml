name: ci-cd

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/small-clinic

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: small_clinic
          POSTGRES_USER: small_clinic
          POSTGRES_PASSWORD: small_clinic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U small_clinic -d small_clinic"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      POSTGRES_DB: small_clinic
      POSTGRES_USER: small_clinic
      POSTGRES_PASSWORD: small_clinic
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.10.9"
      - run: uv sync --frozen
      - name: Format
        run: |
          uv run --no-sync isort --check-only --diff .
          uv run --no-sync black --check .
      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync flake8 .
      - name: Complexity
        run: test -z "$(uv run --no-sync radon cc -s -n C --exclude '.venv/*' .)"
      - name: Migrations are up to date
        run: uv run --no-sync python manage.py makemigrations --check --dry-run
      - name: Tests
        run: uv run --no-sync python -m pytest

  build:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.api_url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure and image
        id: deploy
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          api_url=$(az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "deploy-${{ github.run_number }}" \
            --template-file infra/main.bicep \
            --parameters \
              image="${IMAGE}:${{ github.sha }}" \
              dockerHubUsername="${{ vars.DOCKERHUB_USERNAME }}" \
              dockerHubToken="$DOCKERHUB_TOKEN" \
              djangoSecretKey="$DJANGO_SECRET_KEY" \
              postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
            --query properties.outputs.apiUrl.value -o tsv)
          echo "api_url=$api_url" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        env:
          API_URL: ${{ steps.deploy.outputs.api_url }}
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/doctors/0/availability?date=2026-01-01" || true)
            [ "$status" = "404" ] && echo "API is serving: 404 for unknown doctor" && exit 0
            echo "attempt $attempt: got $status"; sleep 10
          done
          exit 1
